<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="g" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#8b97ff"/>
      <stop offset="0.6" stop-color="#5b6bff"/>
      <stop offset="1" stop-color="#2a34c9"/>
    </radialGradient>
  </defs>

  <!-- glowing core -->
  <circle cx="32" cy="32" r="21" fill="url(#g)"/>

  <!-- icosahedron-style wire mesh over the sphere -->
  <g fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linejoin="round" stroke-opacity="0.75">
    <!-- outer ring -->
    <circle cx="32" cy="32" r="21"/>
    <!-- inner triangle -->
    <polygon points="32,20 42.4,38 21.6,38"/>
    <!-- outer hexagon vertices on the rim -->
    <polygon points="32,11 50.2,21.5 50.2,42.5 32,53 13.8,42.5 13.8,21.5"/>
    <!-- spokes: inner vertices to nearest rim vertices -->
    <path d="M32 20 L32 11 M32 20 L50.2 21.5 M32 20 L13.8 21.5
             M42.4 38 L50.2 21.5 M42.4 38 L50.2 42.5 M42.4 38 L32 53
             M21.6 38 L13.8 21.5 M21.6 38 L13.8 42.5 M21.6 38 L32 53"/>
  </g>

  <!-- tilted orbit ring, like the hero core -->
  <ellipse cx="32" cy="32" rx="29" ry="9" transform="rotate(-24 32 32)"
           fill="none" stroke="#38e8ff" stroke-width="1.3" stroke-opacity="0.9"/>
  <circle cx="7.5" cy="41" r="1.9" fill="#38e8ff"/>
</svg>
